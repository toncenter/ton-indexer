  "Hipo round end unstake postponed to the next round":
    # burn_tokens outcome (b): the treasury could not fund the payout, and a later round
    # still held bills, so it minted a new bill against that round instead. Bill A has
    # already burned and bill B now tracks the same unstake, so without an action here the
    # user's original stake_withdrawal_request (ts_nft = bill A) and the settlement that
    # eventually arrives (ts_nft = bill B) could never be paired.
    #
    # `ts_nft` is the NEW bill, so the chain stays joinable forwards; the burned bill is
    # asserted on the block as `previous_bill` and stays reachable in the action's accounts.
    # This is the only time this has happened on mainnet (2024-11-22), an 831,854 hGRAM
    # unstake that did not fit in the round that was settling.
