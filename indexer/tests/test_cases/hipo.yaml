  "Hipo stake by comment":
    # A plain GRAM transfer whose entire body is the text comment "d". treasury.fc op 0
    # reads one byte and routes "d"/"D" into the same deposit handler with coins = 0,
    # meaning "stake everything after fees". Hipo documents this for senders that cannot
    # attach a custom payload; this is a real 5,717,000 GRAM deposit made that way from a
    # multisig. The message carries op-code 0, so it never becomes a CallContractBlock and
    # a matcher keyed on the deposit_coins op-code alone does not see it at all.
    # This one also happens to land mid-round, so it is deferred and mints a bill.
