cases:
  Gasless send by a Telegram wallet:
    # Testnet. A relayer pays the gas: it forwards the owner's SendBulkMessagesRequestI
    # (0x73896E74) to the Telegram wallet as an internal message carrying 0.005 TON.
    # The wallet's own transfer stays a separate action - gasless_request is only a marker
    # on the relayed request, the way contract_deploy marks a deploying transfer.
    trace-id: jFObmtSqr6Fzn6QnPonxGlzgTWjWvRcoi0BF_wSCjcM=
    expected-actions:
      - type: gasless_request
        values:
          success: true
          action_id: "Gqy5wkGo7Egv/9ZPtNgjUGzVYlMk534Ujm1n+0j7rVg="
          # the marker is the parent of the relayed actions, it has no gasless parent itself
          extra.parent_gasless_action: null
          source: "0:E15488B65F7E904F1D14C84AC6F603CCC4A404B03BEFB568D5F5CC8ED6866887"
          destination: "0:E55E63B850B71B8FF5AD44E1B8271237AFAF31900B2B6D41233707BB585B8091"
          value: 5000000
          accounts:
            - "0:E15488B65F7E904F1D14C84AC6F603CCC4A404B03BEFB568D5F5CC8ED6866887"
            - "0:E55E63B850B71B8FF5AD44E1B8271237AFAF31900B2B6D41233707BB585B8091"
          tx_hashes:
            - "jFObmtSqr6Fzn6QnPonxGlzgTWjWvRcoi0BF/wSCjcM="
            - "0H5D3xdC6NdacUiYr8+UxD8GXdXeo5VTWS7fnhO5PrY="
      # the message the wallet actually sent out: still its own action, but linked to the request
      - type: ton_transfer
        values:
          success: true
          extra.parent_gasless_action: "Gqy5wkGo7Egv/9ZPtNgjUGzVYlMk534Ujm1n+0j7rVg="
          source: "0:E55E63B850B71B8FF5AD44E1B8271237AFAF31900B2B6D41233707BB585B8091"
          destination: "0:274BBBC78DFA3093C1BDA033A0B7F649B6268E61C53E9E019CCFC4B17CACC251"
          value: 1000000
