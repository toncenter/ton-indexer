# The substreams modules of the TON Firehose and their SDK: one lock file, one
# target directory and one release profile.
#
# - substreams-ton: the SDK;
# - modules: modules to run;
# - tests: modules that check the TON Firehose, fireton and ton-tvm-executor;
# - tools/pbgen: generates the protobuf code of the SDK.
[workspace]
resolver = "2"
members = ["substreams-ton", "modules/jetton-transfers", "modules/ton-traces", "tests/smoke", "tests/ton-tvm-probe", "tools/pbgen"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/toncenter/ton-indexer"

[workspace.dependencies]
buffa = "0.9"
buffa-build = "0.9"
buffa-types = "0.9"
getrandom = "0.3"
hex = "0.4"
num-bigint = "0.4"
protoc-bin-vendored = "3"
# Crates take the features they use: the SDK takes models and base64.
rston = { version = "0.5", default-features = false }
sha2 = "0.10"
substreams = "0.8"
substreams-ton = { path = "substreams-ton" }

# Modules are wasm: small, without debug info. The module hash of substreams
# covers the wasm, which depends on the sources, Cargo.lock and
# rust-toolchain.toml, and also on where they are: panic messages keep the
# absolute paths of the sources (trim-paths is not stable yet), so builds in
# other directories differ. Build a module by itself, from its directory or
# with -p: a build of the whole workspace unifies the features of shared
# dependencies and gives other wasm.
[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
