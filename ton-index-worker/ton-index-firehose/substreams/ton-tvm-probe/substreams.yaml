specVersion: v0.1.0
package:
  name: ton_tvm_probe
  version: v0.1.0
  doc: |
    Calls every kind of the ton_v1 extension on every block: a test of
    fireton, ton-tvm-router and the SDK, made for the stub backend.

network: ton

protobuf:
  files:
    - sf/ton/type/v1/type.proto
    - probe/v1/probe.proto
  importPaths:
    - ../../proto
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/ton_tvm_probe.wasm

modules:
  - name: map_probe
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.Probe

  # get_account against the block, with ton-tvm-executor as the backend.
  - name: map_account_check
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.AccountCheck

  # get_method on the network state against the same on its BOC, with
  # ton-tvm-executor as the backend.
  - name: map_get_method_check
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.GetMethodCheck

  - name: map_emulate_check
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.EmulateCheck

  - name: map_tx_point_check
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.TxPointCheck

  # rston, the TON library of acton, against the conversion of the executor.
  - name: map_rston_check
    kind: map
    inputs:
      - source: sf.ton.type.v1.Block
    output:
      type: proto:probe.v1.RstonCheck
