[package]
name = "ton_tvm_probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hex.workspace = true
sha2.workspace = true
prost.workspace = true
substreams.workspace = true
substreams-ton.workspace = true
