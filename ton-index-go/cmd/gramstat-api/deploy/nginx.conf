# Replace PRIVATE_BIND_ADDRESS with this host's internal/VPN IPv4 address.
# Included in nginx's http context. The API process binds only to loopback.
limit_req_zone $binary_remote_addr zone=gramstat_api:10m rate=5r/s;
server {
    listen PRIVATE_BIND_ADDRESS:2007;
    server_name _;
    root /opt/gramstat/ui;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=gramstat_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2008;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|app\.mjs|catalogue\.mjs|charts\.mjs|data\.mjs|style\.css|favicon\.svg)$ {
        limit_except GET { deny all; }
        types { text/html html; text/javascript mjs; text/css css; image/svg+xml svg; }
        expires -1;
        try_files $uri =404;
    }
    # Historic snapshots, provenance, tests and repository files are not public.
    location / { return 404; }
}
