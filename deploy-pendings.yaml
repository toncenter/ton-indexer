- name: Prepare to build
  hosts: builder
  gather_facts: true
  tasks:
    - name: Install requirements
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - build-essential
          - cmake
          - clang
          - openssl
          - libssl-dev
          - zlib1g-dev
          - gperf
          - wget
          - git
          - curl
          - liblz4-dev
          - pkg-config
          - libsecp256k1-dev
          - libsodium-dev
          - libhiredis-dev
          - python3-dev
          - libpq-dev
          - automake
          - libjemalloc-dev
          - lsb-release
          - software-properties-common
          - gnupg
          - autoconf
          - libtool
          - libmicrohttpd-dev
          - ccache
          - rsync
        state: present
      become: true
    
    - name: Ensure shared caches exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0775"
      loop:
        - "{{ ansible_env.HOME }}/.cache/ccache"
        - "{{ ansible_env.HOME }}/.cache/go-build"
        - "{{ ansible_env.HOME }}/.cache/gomod"

    - name: Ensure golang is installed
      ansible.builtin.include_role:
        name: geerlingguy.go
        apply:
          become: true
      vars:
        go_version: "1.24.7"
        go_checksum: "da18191ddb7db8a9339816f3e2b54bdded8047cdc2a5d67059478f8d1595c43f"

- name: Build ton-indexer binaries
  hosts: builder
  gather_facts: true
  tasks:
    - name: Create temp workspace
      ansible.builtin.tempfile:
        state: directory
        suffix: ton-indexer
      register: builddir

    - block:
        - name: Copy project to builder from . to "{{ builddir.path }}" with rsync
          ansible.builtin.synchronize:
            src: "./"
            dest: "{{ builddir.path }}"
            rsync_opts:
              - "--exclude=.git"
              - "--exclude=artifacts"
            recursive: yes
            delete: no

        - name: Build ton-trace-emulator
          ansible.builtin.shell: |
            set -e
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -S . -B "{{ builddir.path }}/build" \
                  -G Ninja \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 
            cmake --build "{{ builddir.path }}/build" \
                  --parallel {{ ansible_facts.processor_vcpus | default(2) }} \
                  --target ton-trace-emulator
          args:
            chdir: "{{ builddir.path }}"
          environment:
            CCACHE_DIR: "{{ ansible_env.HOME }}/.cache/ccache"
            CCACHE_BASEDIR: "{{ builddir.path }}"
            CCACHE_SLOPPINESS: "file_macro"
            GOCACHE: "{{ ansible_env.HOME }}/.cache/go-build"
            GOMODCACHE: "{{ ansible_env.HOME }}/.cache/gomod"
            GOFLAGS: "-modcacherw"

        - name: Collect built binaries
          ansible.builtin.fetch:
            src: "{{ builddir.path }}/build/{{ item }}"
            dest: "artifacts/"
            flat: true
          loop:
            - "ton-index-worker/ton-trace-emulator/ton-trace-emulator"
      always:
        - name: Cleanup workspace
          ansible.builtin.file:
            path: "{{ builddir.path }}"
            state: absent

- name: Deploy services
  hosts: "{{ stack_name }}__pendings"
  become: true
  tags: [deploy]
  tasks:
    - name: Ensure binary directory
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        recurse: true
        state: directory

    - name: Install requirements
      ansible.builtin.apt:
        name:
          - dnsutils
          - libpq-dev
          - libsecp256k1-dev
          - libsodium-dev
          - libhiredis-dev
          - redis-tools
        state: present

    - name: Copy binaries
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
        force: true
      with_items:
        - src: "artifacts/ton-trace-emulator"
          dest: "{{ deploy_path }}/{{ stack_name }}__trace_emulator"

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: false

    - name: Stop and disable legacy trace_ttl_tracker service
      ansible.builtin.systemd:
        name: "{{ stack_name }}__trace_ttl_tracker"
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove legacy trace_ttl_tracker files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ systemd_service_path }}/{{ stack_name }}__trace_ttl_tracker.service"
        - "{{ deploy_path }}/{{ stack_name }}__trace_ttl_tracker"

    - name: Stop and disable legacy pending action classifier service
      ansible.builtin.systemd:
        name: "{{ stack_name }}__pendings_action_classifier"
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove legacy pending action classifier service
      ansible.builtin.file:
        path: "{{ systemd_service_path }}/{{ stack_name }}__pendings_action_classifier.service"
        state: absent

    - name: Setup trace_emulator service
      ansible.builtin.template:
        src: "ansible/systemd.service.j2"
        dest: "{{ systemd_service_path }}/{{ service_name }}.service"
        mode: "0644"
        force: true
      vars:
        service: "{{ services[item] }}"
        service_name: "{{ stack_name }}__{{ item }}"
        start_cmd: "{{ deploy_path }}/{{ service_name }} {{ service.additional_args }}"
      with_items:
        - trace_emulator
    
    - name: Install and configure Redis
      ansible.builtin.include_role:
        name: geerlingguy.redis
      vars:
        redis_bind_interface: '0.0.0.0'
        redis_requirepass: "{{ pendings_redis_password }}"

    - name: Configure Redis max clients
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^\s*#?\s*maxclients\s+'
        line: "maxclients 100000"
      register: redis_maxclients_config

    - name: Comment Redis RDB save rules
      ansible.builtin.replace:
        path: /etc/redis/redis.conf
        regexp: '^(?!\s*#)(\s*save\s+(?!""\s*(?:#.*)?$).*)$'
        replace: '# \1'
      register: redis_save_rules_commented

    - name: Disable Redis RDB snapshots
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^\s*#?\s*save\s+""\s*(?:#.*)?$'
        line: 'save ""'
        insertafter: '^#?\s*save\s+'
      register: redis_save_disabled

    - name: Restart Redis after config change
      ansible.builtin.systemd:
        name: redis-server
        state: restarted
      when: redis_maxclients_config.changed or redis_save_rules_commented.changed or redis_save_disabled.changed

    - name: Stop pendings services before restart
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped
        daemon_reload: true
      vars:
        service_name: "{{ stack_name }}__{{ item }}"
      throttle: 1
      with_items:
       - trace_emulator

    - name: Restart and enable pendings services
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        enabled: true
        force: true
        daemon_reload: true
      vars:
        service_name: "{{ stack_name }}__{{ item }}"
      throttle: 1
      with_items:
       - trace_emulator
