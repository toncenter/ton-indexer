---
stack_name: ton_index

# api config. Adjust this
pg_database: ton_index
pg_readonly_user: readonly
pg_readonly_password: REPLACEME

pg_master_host: postgres-host
pg_master_user: postgres
pg_master_password: REPLACEME

clickhouse_host: clickhouse-host
clickhouse_port: 9000
clickhouse_database: ton_index
clickhouse_user: default
clickhouse_password: REPLACEME

pendings_redis_password: REPLACEME

# firehose and substreams (deploy-substreams.yaml, -e stack_name=mainnet).
# firecore release for the reader-node, merger, relayer and firehose; substreams
# run fireton, firecore v1.21.1 with the ton_v1 extension, built with Go
# fireton_go_toolchain
firecore_version: v1.20.1
firecore_sha256: 06813c9b5d796f499fc1e0dc4179fc8238cc0dabbbb5fce342d73d3d1eecfb51
fireton_go_toolchain: go1.27.3
# the system user of merger, relayer, firehose, substreams and ton-tvm-router
firehose_user: firecore
# the data dirs of these services and the cache of substreams, on a large disk
firehose_data_path: /srv/scratch/{{ firehose_user }}
# the bucket with merged-blocks, one-blocks and forked-blocks, and a key that writes it
firehose_store: s3://garage-host:3900/firehose
firehose_store_params: region=garage&insecure=true
firehose_s3_access_key_id: REPLACEME
firehose_s3_secret_access_key: REPLACEME
# the cache of module outputs, shared by tier1 and tier2: a local directory or a store URL
substreams_state_store: "{{ firehose_data_path }}/substreams-states"
# the shared libraries of ton-tvm-executor, Ubuntu 24.04
tvm_executor_packages: [libjemalloc2, "libgrpc++1.51t64"]
# the addresses components connect to, from the inventory: the reader-nodes
# for the relayer, the relayer for firehose and substreams, the executor for
# ton-tvm-router
firehose_reader_addrs: "{{ groups[stack_name ~ '__firehose_reader'] | map('extract', hostvars, 'firehose_private_ip') | map('regex_replace', '$', ':10010') | join(',') }}"
firehose_relayer_addr: "{{ hostvars[groups[stack_name ~ '__firehose_relayer'][0]].firehose_private_ip }}:10014"
tvm_executor_addr: "{{ hostvars[groups[stack_name ~ '__tvm_executor'][0]].firehose_private_ip }}:10060"
firehose_common_args: >-
  --log-to-file=false --common-first-streamable-block=1
  "--common-one-block-store-url={{ firehose_store }}/one-blocks?{{ firehose_store_params }}"
  "--common-merged-blocks-store-url={{ firehose_store }}/merged-blocks?{{ firehose_store_params }}"
  "--common-forked-blocks-store-url={{ firehose_store }}/forked-blocks?{{ firehose_store_params }}"
# firecore does not know TON and cannot derive these from the genesis block
firehose_advertise_args: --advertise-chain-name=ton --advertise-block-id-encoding=hex --ignore-advertise-validation

# deploy config. Adjust this also
deploy_path: /opt/ton-index
systemd_service_path: /etc/systemd/system

services:
  api:
    additional_args: -bind ":4100" -pg postgresql://{{ pg_readonly_user }}:{{ pg_readonly_password }}@localhost:5432/{{ pg_database }}?application_name={{ service_name }} -pg-master postgresql://{{ pg_master_user }}:{{ pg_master_password }}@{{ pg_master_host }}/{{ pg_database }}?application_name={{ service_name }}  
  index_postgres:
    additional_args: --working-dir /var/ton-index/ --db /var/ton-work/db --from 29000000
  index_clickhouse:
    additional_args: --working-dir /var/ton-index-clickhouse/ --db /var/ton-work/db --from 29000000
  metadata_fetcher:
    additional_args: -pg postgresql://{{ pg_master_user }}:{{ pg_master_password }}@localhost:5432/{{ pg_database }}?application_name={{ service_name }}
  emulate_api:
    additional_args: -prefork
  trace_task_emulator:
    additional_args: --working-dir /var/ton-trace-task-emulator --db /var/ton-work/db --threads 16 2>&1
    workdir: "{{ deploy_path }}"
  action_classifier:
    additional_args: --emulated-trace-tasks --emulated-traces-redis-channel classifierchannel
    environment: ton_indexer_redis_dsn=redis://localhost:6379
  trace_emulator:
    additional_args: --working-dir /var/ton-trace-emulator --db /var/ton-work/db --threads 16 --redis "redis://{{ pendings_redis_password }}@localhost:6379" --trace-root-pending-ttl 30 --trace-root-replaced-confirmed-ttl 30 --trace-open-ttl 300 --trace-completed-ttl 30 --addr "{{ host_addr }}" --global-config /var/ton-work/etc/global.config.json 2>&1
    workdir: "{{ deploy_path }}"
  index_classifier:
    additional_args: --pool-size 8
    environment:
      - "TON_INDEXER_REDIS_DSN=redis://127.0.0.1:6379"
      - "TON_INDEXER_PG_DSN=postgresql+asyncpg://{{ pg_master_user }}:{{ pg_master_password }}@{{ pg_master_host }}:5432/{{ pg_database }}?application_name={{ stack_name }}__index_classifier"
  firehose_reader:
    # ton-index-firehose: --from is for the first start only, then it resumes from its cursor
    # in the working dir
    node_args: --db /var/ton-work/db --working-dir /var/ton-firehose --from 100100000 --prewarm 3000 --threads 16 --max-active-tasks 16
    # firecore reader-node: the block stream for the relayer and the metrics listen on the private
    # address, everything else on localhost
    additional_args: >-
      --data-dir /var/firehose-reader --log-to-file=false
      --common-first-streamable-block 1
      "--common-one-block-store-url={{ firehose_store }}/one-blocks?{{ firehose_store_params }}"
      --reader-node-start-block-num 100100000
      --reader-node-one-block-suffix {{ inventory_hostname | regex_replace('[^A-Za-z0-9]', '') }}
      --reader-node-blocks-chan-capacity 2000
      --reader-node-grpc-listen-addr {{ firehose_private_ip }}:10010
      --reader-node-manager-api-addr 127.0.0.1:10011
      --metrics-listen-addr {{ firehose_private_ip }}:9102
    directories: [/var/ton-firehose, /var/firehose-reader]
    environment_file: "{{ deploy_path }}/{{ stack_name }}__firehose_reader.env"
    memory_max: 32G
  tvm_executor:
    # the owner of the node db, which ton-tvm-executor opens as a RocksDB secondary
    service_user: validator
    service_group: validator
    additional_args: >-
      --db /var/ton-work/db --working-dir /var/ton-tvm-executor
      --listen-addr {{ firehose_private_ip }}:10060 --threads 8 --celldb-cache-size 1024
    directories: [/var/ton-tvm-executor]
    memory_max: 32G
  firehose_merger:
    additional_args: >-
      --config-file= --data-dir={{ firehose_data_path }}/merger {{ firehose_common_args }}
      --merger-grpc-listen-addr=127.0.0.1:10012 --merger-http-healthz-addr=127.0.0.1:10013
      --metrics-listen-addr={{ firehose_private_ip }}:9103 --pprof-listen-addr=127.0.0.1:6061
      --log-level-switcher-listen-addr=127.0.0.1:1066
    directories: ["{{ firehose_data_path }}/merger"]
    memory_max: 16G
  firehose_relayer:
    additional_args: >-
      --config-file= --data-dir={{ firehose_data_path }}/relayer {{ firehose_common_args }}
      --relayer-source={{ firehose_reader_addrs }}
      --relayer-grpc-listen-addr={{ firehose_private_ip }}:10014 --relayer-http-healthz-addr=127.0.0.1:10018
      --metrics-listen-addr={{ firehose_private_ip }}:9104 --pprof-listen-addr=127.0.0.1:6062
      --log-level-switcher-listen-addr=127.0.0.1:1067
    directories: ["{{ firehose_data_path }}/relayer"]
    memory_max: 16G
  firehose:
    # gRPC for clients on the private address, without TLS or auth
    additional_args: >-
      --config-file= --data-dir={{ firehose_data_path }}/firehose {{ firehose_common_args }} {{ firehose_advertise_args }}
      --common-live-blocks-addr={{ firehose_relayer_addr }}
      --firehose-grpc-listen-addr={{ firehose_private_ip }}:10015
      --metrics-listen-addr={{ firehose_private_ip }}:9107 --pprof-listen-addr=127.0.0.1:6063
      --log-level-switcher-listen-addr=127.0.0.1:1068
    directories: ["{{ firehose_data_path }}/firehose"]
    memory_max: 32G
  tvm_router:
    additional_args: --listen-addr=127.0.0.1:10040 --metrics-addr={{ firehose_private_ip }}:9140 --executor-addr={{ tvm_executor_addr }}
    memory_max: 4G
  substreams_tier1:
    # gRPC for clients on the private address, without TLS or auth; tier1 passes the router
    # address to tier2 with every request. max-subrequests: the segments of a request that
    # tier2 runs at once
    additional_args: >-
      --config-file= --data-dir={{ firehose_data_path }}/substreams-tier1 {{ firehose_common_args }} {{ firehose_advertise_args }}
      --common-live-blocks-addr={{ firehose_relayer_addr }}
      --substreams-tier1-block-type=sf.ton.type.v1.Block
      --substreams-tier1-grpc-listen-addr={{ firehose_private_ip }}:10016
      --substreams-tier1-subrequests-endpoint=127.0.0.1:10017
      --substreams-tier1-max-subrequests=16
      --substreams-state-store-url={{ substreams_state_store }}
      --substreams-ton-router-addr=127.0.0.1:10040
      --metrics-listen-addr={{ firehose_private_ip }}:9105 --pprof-listen-addr=127.0.0.1:6064
      --log-level-switcher-listen-addr=127.0.0.1:1069
    # wazero gives the same outputs as wasmtime, several times faster on light blocks
    environment: SUBSTREAMS_WASM_RUNTIME=wazero
    directories: ["{{ firehose_data_path }}/substreams-tier1", "{{ substreams_state_store }}"]
    memory_max: 32G
  substreams_tier2:
    additional_args: >-
      --config-file= --data-dir={{ firehose_data_path }}/substreams-tier2 {{ firehose_common_args }} {{ firehose_advertise_args }}
      --common-live-blocks-addr=
      --substreams-tier2-grpc-listen-addr=127.0.0.1:10017
      --substreams-state-store-url={{ substreams_state_store }}
      --metrics-listen-addr={{ firehose_private_ip }}:9106 --pprof-listen-addr=127.0.0.1:6065
      --log-level-switcher-listen-addr=127.0.0.1:1070
    environment: SUBSTREAMS_WASM_RUNTIME=wazero
    directories: ["{{ firehose_data_path }}/substreams-tier2", "{{ substreams_state_store }}"]
    memory_max: 128G
  streaming_api:
    additional_args: -testnet -redis "redis://:{{ pendings_redis_password }}@localhost:6379" -pg "postgresql://{{ pg_readonly_user }}:{{ pg_readonly_password }}@localhost:5432/{{ pg_database }}"
