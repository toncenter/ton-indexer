all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
  hosts:
    ubuntu-01:
      ansible_host: 192.168.66.1
    ubuntu-02:
      ansible_host: 192.168.66.2
    ubuntu-03:
      ansible_host: 192.168.66.3
    master-01:
      ansible_host: 192.168.69.1
  children:
    ton_index__master_nodes:
      hosts:
        master-01:
    ton_index__replica_nodes:
      hosts:
        ubuntu-01:
        ubuntu-02:
        ubuntu-03:
    ton_index__emulation:
      hosts:
        emulation-01:
    ton_index__pendings:
      hosts:
        pendings-01:
          host_addr: 1.2.3.4:9876 # public ip of this machine with port to be used for ton-trace-emulator
    # deploy-substreams.yaml with -e stack_name=mainnet. firehose_private_ip of a host is the
    # address other components and Prometheus connect to; one host may be in several groups
    mainnet__firehose_reader:
      hosts:
        archive-01:
          firehose_private_ip: 10.0.0.1
    mainnet__tvm_executor:
      hosts:
        archive-01:
    mainnet__firehose_merger:
      hosts:
        store-01:
          firehose_private_ip: 10.0.0.2
    mainnet__firehose_relayer:
      hosts:
        store-01:
    mainnet__firehose:
      hosts:
        store-01:
    mainnet__substreams:
      hosts:
        store-01:
    ton_index__index_classifier:
      hosts:
        classifier-01:
          ansible_host: 192.168.69.10
        
